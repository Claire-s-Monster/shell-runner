---
name: "shell-runner CodeQL config"

# Pass to github/codeql-action/init as `config-file: ./.github/codeql/codeql-config.yml`.
# The ci-framework sast-codeql job (reusable-ci.yml) has no such input yet, so until it
# gains one this file is not consumed by CI (shell-runner#129).
#
# The local suite is the default Python code-scanning suite with py/path-injection swapped
# for .github/codeql/queries/PathInjection.ql, which adds ShellRunnerGates.qll: a barrier on
# the path parameter of script_pin._path_stat and script_pin._open_regular only (read-only,
# regular-file-only gates). Default queries are disabled because the suite already
# contains them.
disable-default-queries: true
queries:
  - uses: ./.github/codeql/queries/shell-runner.qls

# executor.py: the sandboxed executor accepts a client-provided cwd on purpose (confined to
# the configured roots by resolve_cwd). CodeQL reports it at the `resolved.exists()` /
# `resolved.is_dir()` calls in resolve_cwd (alerts 33 and 34, dismissed as won't fix). No
# inline suppression is used: `# codeql[py/path-injection]` on those lines did not close the
# alerts in the ci-framework job (PR 130 alerts 55 and 56), and a query-filters exclude
# cannot be scoped by path.
