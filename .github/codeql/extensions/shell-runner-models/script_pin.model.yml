# script_pin probes paths named by the command being pinned, on purpose. Every probe
# goes through _path_stat (abspath, realpath, NUL refused, then only stat). It
# returns a stat result, not the path, so the barrier sits on its parameter, and
# _is_regular (which wraps it) guards the later open() in _read_capped.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - ["shell_runner.script_pin", "Member[_path_stat].Parameter[0]", "path-injection"]
  - addsTo:
      pack: codeql/python-all
      extensible: barrierGuardModel
    data:
      - ["shell_runner.script_pin", "Member[_is_regular].Argument[0]", "true", "path-injection"]
