# Install to ~/.config/systemd/user/shell-runner.service.d/override.conf
[Unit]
# Never latch the unit off after a burst of failures: a transient port-4111
# conflict once turned a ~1min outage into an 8-day one (2026-08-02).
StartLimitIntervalSec=0

[Service]
MemoryMax=512M
MemorySwapMax=0
# Slower retries so indefinite restarting stays cheap and gives a squatting
# process time to release the port.
RestartSec=15
