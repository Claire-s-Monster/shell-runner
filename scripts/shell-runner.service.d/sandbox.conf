# Install to ~/.config/systemd/user/shell-runner.service.d/sandbox.conf
# Issue #82: the service's / is read-only except /dev, /proc, /sys and the paths below.
# NOTE: /home is NOT protected (systemd 252 user units silently skip ProtectHome=
# and ReadOnlyPaths= under /home). Delete this file to disable the sandbox.
# The leading "-" makes a missing path non-fatal; %t is the runtime dir.
# PrivateUsers=yes is required: systemd user managers silently ignore
# ProtectSystem= unless the unit gets its own user/mount namespace (#82).
[Service]
ProtectSystem=strict
PrivateUsers=yes
ReadWritePaths=-/tmp -/var/tmp -%t
